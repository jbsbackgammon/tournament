name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test import, progression, layouts and PNG metadata
        run: npm test
      - name: Build static app
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-site
          path: dist
          retention-days: 14
