<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="eJBSから対戦表を取り込み、8・16・32・64枠のトーナメント表をPNGで作成。">
  <title>Tournament — トーナメント表作成</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=202609240400">
</head>
<body>
  <main class="workspace">
    <div class="top-layout">
    <aside class="controls" aria-label="大会の設定">
      <section>
        <h2>入力</h2><div class="input-grid"><div>
        <div class="row input-actions-row input-size-row"><select aria-label="枠数" id="source-size"><option value="8">8枠</option><option value="16" selected>16枠</option><option value="32">32枠</option><option value="64">64枠</option></select><button id="new-tournament">新規作成</button></div>
        <textarea aria-label="eJBSソースを貼り付け" id="source-text" rows="3" spellcheck="false"></textarea>
        <div class="row input-actions-row"><button class="dark" id="import-source">eJBS取込</button><label class="button" for="open-json">JSON取込</label><input hidden type="file" id="open-json" accept=".json"><button id="history-load">履歴呼出</button></div>
      </div></div>
      </section>
      <section class="output-section"><h2>出力</h2><div class="output-grid">
        <div class="row output-format-row"><select aria-label="出力枠数" id="output-size"><option value="8">8枠</option><option value="16" selected>16枠</option><option value="32">32枠</option><option value="64">64枠</option></select><select aria-label="出力サイズ" id="format"><option value="hd">1920 × 1080 px（WEB横）</option><option value="a4">2480 × 3508 px（A4縦）</option><option value="a5">2480 × 1748 px（A5横）</option></select></div>
        </div><div id="dimensions" class="help"></div>
        <div class="export-actions"><button id="export-png" class="primary">PNG出力</button><button id="save-json">JSON出力</button></div>
      </section>
    </aside>
    <section class="preview-surface" aria-label="トーナメント表"><div id="preview"></div></section>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
    <div class="editing-layout">
      <section class="editor-section">
        <div class="editor-heading"><h2>編集</h2><div class="editor-options"><label class="check"><input id="show-notes" type="checkbox" checked>選手補足有</label><label class="check"><input id="show-losers-gray" type="checkbox" checked>敗者非活性</label><label class="check"><input id="show-bye-gray" type="checkbox" checked>BYE非活性</label><label class="check"><input id="show-titles" type="checkbox">五大タイトル表示</label><label class="check"><input id="show-bottom-margin" type="checkbox">下余白有</label></div></div>
        <div class="editor-meta-row"><label>ラウンド<select id="edit-round"></select></label><label class="edition">回次等<input id="edition" maxlength="40"></label><label class="title-picker-label">大会名<div class="title-picker"><button type="button" id="master-toggle">選択</button><input id="title" maxlength="100"><select id="tournament-master" aria-label="大会名マスタ" size="7" hidden></select></div></label><label>メインカラー<input id="accent" type="text" inputmode="text" maxlength="7" aria-label="メインカラーコード"><span class="accent-swatch" id="accent-swatch"></span></label></div>
        <div id="players-editor" class="players-grid"></div>
        <div id="titles-editor" hidden></div>
      </section>
    </div>
  </main>
  <dialog id="replace-dialog"><h2>現在の大会データを置き換えますか？</h2><p>必要な場合はキャンセルして「大会データを保存」してください。</p><form method="dialog"><button value="cancel">キャンセル</button><button value="replace" class="dark">置き換える</button></form></dialog>
  <dialog id="history-dialog"><h2>履歴呼出</h2><select id="history-select" size="8"></select><form method="dialog"><button value="cancel">キャンセル</button><button value="load" class="dark">呼び出す</button></form></dialog>
  <script type="module" src="./src/app.js?v=202609240600"></script>
</body>
</html>
